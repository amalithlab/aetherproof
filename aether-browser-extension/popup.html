<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      margin: 0;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .header img {
      width: 24px;
      height: 24px;
    }
    .header h3 {
      margin: 0;
      font-size: 14px;
      color: #00e5ff;
    }
    .status-card {
      background: #252526;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: bold;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #555;
    }
    .dot.connected { background: #4cd964; }
    .dot.disconnected { background: #ff3b30; }
    .info-text {
      font-size: 10px;
      color: #888;
      margin-top: 6px;
      line-height: 1.4;
    }
    button {
      width: 100%;
      background: #00e5ff;
      color: #050505;
      border: none;
      padding: 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }
    button:hover {
      background: #33ebff;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>AETHER Browser Provider</h3>
  </div>
  <div class="status-card">
    <div class="status-row">
      <div id="status-dot" class="dot disconnected"></div>
      <span id="status-text">Connecting...</span>
    </div>
    <div class="info-text" id="info-text">Target: ws://localhost:7823</div>
  </div>
  <button id="reconnect-btn">Reconnect to IDE</button>
  <script src="popup.js"></script>
</body>
</html>
